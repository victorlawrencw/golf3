		<style>

body{

}

.boxes{
    border-radius: 10px;

}

#ptdiv, #pdiv{
    position: absolute;
    width: 100%;
    bottom: 5px;

    display: flex;

    margin-left: 0;
}

    width: 98%;

    background-color: #00b7fd;
}
.texts{
 text-indent: 10px;

        <body>
            <div id="parallaxy">
                <div id="ptdiv">

                <div style="border-top:2px solid #ff4791;" class="pbox"></div>
                </div>
                <div id="pdiv"></div>
            </div>
<div id="top">
    <button class="topbuttons" style="width:100px; color: #00b7fd;">CoderV</button>
    <button class="topbuttons col0">A</button>

<div class="texts"></div>
<div class="section">
<div class="boxes"></div>
<div class="boxes"></div>
<div class="boxes"></div>
</div>
</div>
<div id="footer">

</div>
<script type="text/javascript">
    let pbox = document.getElementsByClassName('pbox');
    let ih = window.innerHeight;

    window.onscroll = function(){
        let scp = (window.pageYOffset/document.body.offsetHeight);
        pbox[0].style.rotate = (scp*360)+'deg';
        pbox[1].style.rotate = ('-'+scp*360)+'deg';
        document.getElementById('ptdiv').style.bottom = (ih*scp)+'px';
        document.getElementById('pdiv').style.bottom = (ih*0.5*scp)+'px';
    }
</script>
